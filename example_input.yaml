pains:
  - プロジェクトを何度も途中で捨ててしまう
  - AI Agentに頼めばできるだけのプロダクトは作りたくない
  - チーム内で同じ失敗を繰り返している
  - 新規性があるかどうか自分では判断しにくい
  - LLMにテキストでコンテキスト与えるのが煩雑
  - ADHDで先延ばししてしまう

themes:
  - 自己理解
  - チーム
  - 複数AI
  - 人間とAIの関係
  - 継続的な振り返り

existing_ideas:
  - "PROJECT AUTOPSY: 過去のプロジェクト失敗をAIが分析する"
  - "THE FOURTH MEMBER: チームに欠けている視点をAI人格で補う"

seed_ideas:
  - "過去の自分の失敗を、現在の意思決定に参加させるAI"
  - "チームの意思決定に反対意見を出し続ける専用AI人格"

must_have:
  - AIが本質的に必要
  - 7日以内に実装可能
  - 10分デモで伝わる
  - 最新の汎用Agentに1プロンプトで再現できない

must_not:
  - 単なるRAG
  - Agentに一回聞けば済むもの
  - 既存サービスの薄いラッパー

resources:
  duration_days: 7
  team_size: 3
  models:
    - Kimi-K2.6
    - Kimi-K2.7

user_notes: |
  ハッカソンは「課題設定力・独創性/新規性・実装力・AI活用力・実用性」の5観点で評価されます。
  発表10分、質疑約2分です。
